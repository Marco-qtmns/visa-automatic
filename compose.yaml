name: visa-automatic-d1

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${DATA_ROOT:?Set DATA_ROOT}/postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DOCUMENT_STORAGE_ROOT: /srv/visa-automatic/document-storage
      GENERATED_ARTIFACT_STORAGE_ROOT: /srv/visa-automatic/generated-artifact-storage
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      MAX_GENERATED_ARTIFACT_MB: ${MAX_GENERATED_ARTIFACT_MB:-30}
      MAX_CONVERSATION_IMPORT_MB: ${MAX_CONVERSATION_IMPORT_MB:-2}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      QUALITY_PROVIDER: ${QUALITY_PROVIDER:-manual_only}
      FACT_EXTRACTION_PROVIDER: ${FACT_EXTRACTION_PROVIDER:-disabled}
    volumes:
      - type: bind
        source: ${DATA_ROOT:?Set DATA_ROOT}/document-storage
        target: /srv/visa-automatic/document-storage
      - type: bind
        source: ${DATA_ROOT:?Set DATA_ROOT}/generated-artifact-storage
        target: /srv/visa-automatic/generated-artifact-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s
    expose: ["8000"]
    networks: [app, data]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 20s
    expose: ["3000"]
    networks: [app]

  proxy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./deployment/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks: [app]

networks:
  app: {}
  data:
    internal: true
