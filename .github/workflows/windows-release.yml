name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ("${{ github.ref }}".StartsWith("refs/tags/") -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Release tag does not match VERSION.txt"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build and verify portable app and installed app
        shell: pwsh
        run: python tools/build_windows.py --verify-install

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 956A-Generator-Windows
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            release\956A_Generator_Setup.exe `
            release\956A_Generator_Setup.exe.sha256 `
            release\956A_Generator_Windows_Portable.zip `
            release\956A_Generator_Windows_Portable.zip.sha256 `
            release\instructions.txt `
            --title "956A Generator ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md
